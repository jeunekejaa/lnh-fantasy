<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LNH Fantasy</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E13;--card:#141922;--card2:#0F131A;--ink:#E8ECF2;--muted:#8F9AAD;--line:#1F2733;--line2:#1B212C;--accent:#5BD3FF;--accent-ink:#06202D;--opp:#FF8A4C;
  --good:#34D17D;--good-bg:#103A26;--bad:#FF6B6B;--bad-bg:#3D1A1A;--warn:#F5C842;--warn-bg:#3A3012;--blue:#8EA8FF;--blue-bg:#1B2547;--me:#10202B;--chip:#1A2230;
  --display:'Barlow Condensed',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 'Inter Tight',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;max-width:1180px;margin:0 auto}
h1{font-family:var(--display);font-size:30px;line-height:1;margin:0;font-weight:600;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;height:calc(70px + env(safe-area-inset-bottom));padding:8px 4px env(safe-area-inset-bottom);background:#0F131A;border-top:1px solid var(--line);display:flex;justify-content:space-around}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:62px;min-height:48px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;cursor:pointer}
#tabs button.on{color:var(--accent)}
#tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs .subs{display:none}
#tabs .brand{display:none}
body{padding-bottom:96px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:#232B39;color:var(--ink)}
@media (min-width:900px){
  body{padding-bottom:0;padding-left:236px}
  #tabs{top:0;right:auto;bottom:0;width:236px;height:auto;flex-direction:column;justify-content:flex-start;gap:2px;padding:20px 12px;border-top:0;border-right:1px solid var(--line2)}
  #tabs .brand{display:block;font-family:var(--display);font-size:24px;font-weight:600;padding:0 12px 16px;color:var(--ink)}
  #tabs button{flex-direction:row;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;font-size:14px;color:#AEB7C6;justify-content:flex-start}
  #tabs button.on{background:#152634;color:var(--accent)}
  #tabs .subs{display:flex;flex-direction:column;margin:0 0 6px}
  #tabs .subs button{min-height:34px;padding-left:46px;font-size:13px;font-weight:500;color:var(--muted);background:none}
  #tabs .subs button.on{color:var(--ink);background:none}
  .seg.mob{display:none}
}
main{max-width:1180px;margin:0 auto;padding:4px 16px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;overflow-x:auto}
html,body{overflow-x:hidden}
.card h2{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .v{font-family:var(--display);font-size:30px;line-height:1.05;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px}
.tbl{width:100%;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr.me td{background:var(--me);font-weight:600}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:var(--chip);color:var(--muted)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.blue{background:var(--blue-bg);color:var(--blue)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.pos{color:var(--muted);font-size:12px}
.up{color:var(--good)} .down{color:var(--bad)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
select,input,button.btn{font:inherit;border:1px solid #2A3344;background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;min-height:42px}
button.btn{cursor:pointer;font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:12px}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.pick{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pick input{width:18px;height:18px}
.pick .n{flex:1}
.delta{font-family:var(--display);font-size:32px;font-weight:600}
.big{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums}
.hero{background:var(--me);border-color:#1E4A63}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile{background:var(--card2);border-radius:12px;padding:10px 12px}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.empty{color:var(--muted);text-align:center;padding:30px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
@media (max-width:520px){.hide-s{display:none}}
#prog{position:fixed;left:0;right:0;top:0;z-index:40;display:none;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
#prog .track{height:8px;background:var(--chip);border-radius:4px;overflow:hidden;margin-top:6px}
#prog .fill{height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .6s ease}
#prog .row{display:flex;justify-content:space-between;font-size:13px}
footer{color:var(--muted);font-size:11px;text-align:center;padding:20px 16px 40px}
/* Fiche de joueur */
.pn{cursor:pointer;font-weight:600;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.pn:hover{text-decoration-color:var(--accent)}
#ps{position:fixed;inset:0;z-index:30;display:none;background:rgba(0,0,0,.55);flex-direction:column;align-items:center;overflow-y:auto;-webkit-overflow-scrolling:touch}
#ps.on{display:flex}
#ps .sheet{background:var(--bg);border-top:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:680px;padding:12px 16px 32px;margin-top:auto;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
#ps .sheet{padding-top:12px}#ps.on::before{content:'';flex:0 0 40px}
#ps .sheet::before{content:'';display:block;width:40px;height:4px;border-radius:3px;background:#2A3344;margin:0 auto 12px}
@media (min-width:900px){#ps{align-items:flex-end}#ps.on::before{display:none}#ps .sheet{margin:0;border-radius:0;border-top:0;border-left:1px solid var(--line);max-width:600px;min-height:100%;padding:20px}#ps .sheet::before{display:none}}
#ps .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
#ps .hd h2{margin:0;font-family:var(--display);font-size:30px;font-weight:600;line-height:1}
#ps .x{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;width:44px;height:44px;font-size:16px;cursor:pointer;flex:0 0 auto}
#ps h3{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px}
#ps .grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
#ps .kpi .l{font-size:11.5px;line-height:1.25}
#ps input,#ps select{font-size:16px}
#ps .kpi{padding:9px 10px}
#ps .kpi .v{font-size:18px}
#ps .note{font-size:12px;color:var(--muted);margin-top:6px}
#ps .why{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:12px;font-size:13.5px}
#ps .why ul{margin:6px 0 0;padding-left:18px}
#ps .why li{margin:4px 0}
#ps .why .verdict{margin-top:8px;font-weight:600}
#ps .why{border-left:4px solid transparent}
#ps .why.tone-progression{border-left-color:var(--good)} #ps .why.tone-chanceux{border-left-color:var(--blue)}
#ps .why.tone-malchanceux{border-left-color:var(--warn)} #ps .why.tone-panne{border-left-color:var(--bad)}

th.srt{cursor:pointer;user-select:none}
th.srt:hover{color:var(--ink)}
th.srt[data-dir]::after{content:attr(data-dir);margin-left:3px;color:var(--accent)}
#ps table{table-layout:fixed}
#ps th,#ps td{padding:6px 6px;white-space:normal;overflow-wrap:anywhere}
#ps th{font-size:11px;line-height:1.25;vertical-align:bottom}
#ps th .muted{display:block;font-weight:500}
#ps th:first-child,#ps td:first-child{width:30%}
#ps .tbl{overflow-x:visible}
#ps select{max-width:100%;min-width:0;flex:1 1 220px}
@media (max-width:520px){#ps th,#ps td{padding:5px 4px;font-size:12.5px}#ps th{font-size:10.5px}}
.fo2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fo{width:100%;font-size:12.5px;border-collapse:collapse}
.fo th,.fo td{padding:3px 5px;white-space:nowrap}
.fo td.l{white-space:normal}
.fo tr.dim td{opacity:.55}
.fo tr.tot td{border-top:2px solid var(--line);font-weight:600}
@media (max-width:760px){.fo2{gap:10px}.fo{font-size:11.5px}.fo .hs,.fo .pos,.fo .chip{display:none}.fo th,.fo td{padding:5px 3px}.fo td.l{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}

/* ---------- Téléphone (iPhone 14 : 390 px) : aucun défilement de côté ---------- */
@media (max-width:600px){
  main{padding:4px 12px 16px}
  .card{padding:14px 12px}
  th,td{padding:7px 5px}
  /* tableaux trop larges : le texte va à la ligne */
  table.m-wrap th{white-space:normal;font-size:10px;line-height:1.2;vertical-align:bottom}
  table.m-wrap td.mw,table.m-wrap td.mh{white-space:normal}
  table.m-wrap td.mh{min-width:150px}
  table .chip .ct{display:none}
  table .chip{padding:1px 4px}
  table.m-wrap .chip{font-size:10px;padding:1px 6px}
  /* colonnes secondaires repliées sous le nom */
  table .mf{display:none}
  .msub{display:block;font-size:11.5px;font-weight:400;line-height:1.4;margin-top:3px;color:#C9D1DC;white-space:normal}
  .msub .mk{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;margin-right:3px}
  .msub .ms{margin-right:10px;display:inline-block}
  /* tableaux de texte : une fiche par ligne */
  table.m-stack,table.m-stack tbody,table.m-stack tr,table.m-stack td{display:block;width:auto}
  table.m-stack tr.m-head{display:none}
  table.m-stack tr{padding:9px 0;border-bottom:1px solid var(--line2)}
  table.m-stack tr:last-child{border-bottom:0}
  table.m-stack td{border:0;padding:2px 0;text-align:left;white-space:normal;overflow-wrap:anywhere}
  table.m-stack td:empty{display:none}
  table.m-stack td.mi{display:inline-block;margin-right:14px}
  table.m-stack td[data-label]::before{content:attr(data-label);color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;margin-right:6px}
  table.m-stack td.mw::before{display:block;margin-bottom:2px}
  table.m-stack td.mw{margin-top:4px}
  table.m-stack td:first-child{font-weight:600}
  table.m-stack td:first-child::before{display:none}
  /* les 6 duels : grille au lieu d'un carrousel */
  .duels{display:grid!important;grid-template-columns:1fr 1fr;overflow-x:visible!important;scroll-snap-type:none!important}
  .duels>button{min-width:0;padding:8px!important}
  /* face-à-face : nom de famille seulement */
  .fo .fn{display:none}
  .fo td.l{max-width:none}
  .fo th.l{white-space:normal;line-height:1.15}
  .fo th,.fo td{padding:5px 2px}
  .fo2{gap:8px}
  .seg button{font-size:12.5px}
  .controls select,.controls input{min-width:0;flex:1 1 140px;max-width:100%}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1 id="htitle">Semaine</h1><div class="sub" id="stamp">Chargement…</div></div>
    <button class="btn" id="refresh" title="Relire les stats LNH, ESPN et MoneyPuck" aria-label="Mettre à jour" style="display:flex;align-items:center;gap:8px"><svg viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg><span class="hide-s">Mettre à jour</span></button>
  </div>
  <nav id="tabs" aria-label="Navigation"><div class="brand">LNH Fantasy</div><button data-g="ligue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3a3 3 0 0 1-3 4M7 5H4a3 3 0 0 0 3 4"/></svg>Ligue</button><div class="subs" data-for="ligue"><button data-t="board">Classement</button><button data-t="tx">Transactions</button></div><button data-g="team"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 20v-1a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Équipes</button><button data-g="week"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Semaine</button><button data-g="todo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>Que faire</button><button data-g="outils"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Outils</button><div class="subs" data-for="outils"><button data-t="trade">Échange</button><button data-t="waivers">Ballotage</button><button data-t="search">Chercher</button><button data-t="pred">Prédictions</button><button data-t="about">Modèle</button></div></nav>
</header>
<div id="prog"><div class="row"><span id="plabel">Mise à jour…</span><span id="ppct">0 %</span></div><div class="track"><div class="fill" id="pfill"></div></div></div>
<div id="ps" role="dialog" aria-modal="true"><div class="sheet" id="psheet"></div></div>
<main id="view"><div class="empty">Chargement des données…</div></main>
<footer>Données : LNH · ESPN Fantasy · projections des analystes (GAF Aggregate Projections) · stats avancées <a href="https://moneypuck.com" target="_blank" rel="noopener" style="color:inherit">MoneyPuck.com</a></footer>

<script>
let D = null, TAB = 'week';
const GROUPS = { ligue: ['board', 'tx'], team: ['team'], week: ['week'], todo: ['todo'], outils: ['trade', 'waivers', 'search', 'pred', 'about'] };
const GLABEL = { ligue: 'Ligue', team: 'Équipes', week: 'Semaine', todo: 'Que faire ?', outils: 'Outils' };
const TLABEL = { board: 'Classement', tx: 'Transactions', trade: 'Échange', waivers: 'Ballotage', search: 'Chercher', pred: 'Prédictions', about: 'Modèle' };
const LASTSUB = { ligue: 'board', outils: 'trade' };
const groupOf = t => Object.keys(GROUPS).find(g => GROUPS[g].indexOf(t) >= 0) || 'week';
function navState() {
  const g = groupOf(TAB); LASTSUB[g] = TAB;
  document.querySelectorAll('#tabs [data-g]').forEach(x => x.classList.toggle('on', x.dataset.g === g));
  document.querySelectorAll('#tabs [data-t]').forEach(x => x.classList.toggle('on', x.dataset.t === TAB));
  const h = document.getElementById('htitle'); if (h) h.textContent = GLABEL[g];
}
function setTab(t) { TAB = t; render(); window.scrollTo(0, 0); }
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = x => x == null ? '–' : (+x).toFixed(1);
const f2 = x => x == null ? '–' : (+x).toFixed(2);
const pct = x => x == null ? '–' : Math.round(x * 100) + ' %';
const sgn = (x, d = 1) => x == null ? '–' : (x > 0 ? '+' : '') + (+x).toFixed(d);
const OUT = { OUT: 1, INJURY_RESERVE: 1, SUSPENSION: 1, IR: 1 };

// Barre de progression : le serveur publie son avancement, la page le lit chaque seconde
let PT = null, PSTART = 0;
function progress(on) {
  const box = $('#prog');
  if (!on) { clearInterval(PT); PT = null; $('#pfill').style.width = '100%'; $('#ppct').textContent = '100 %'; setTimeout(() => { box.style.display = 'none'; }, 500); $('#refresh').disabled = false; return; }
  PSTART = Date.now(); box.style.display = 'block'; $('#pfill').style.width = '2%'; $('#ppct').textContent = '0 %'; $('#plabel').textContent = 'Démarrage…'; $('#refresh').disabled = true;
  PT = setInterval(() => {
    if (!(window.google && google.script && google.script.run)) return;
    google.script.run.withSuccessHandler(txt => {
      if (!txt || !PT) return;
      const p = JSON.parse(txt);
      if (p.t < PSTART - 5000) return;   // progression d'une ancienne mise à jour
      $('#pfill').style.width = Math.max(2, p.pct) + '%'; $('#ppct').textContent = p.pct + ' %';
      $('#plabel').textContent = p.label + ' (' + Math.round((Date.now() - PSTART) / 1000) + ' s)';
    }).getProgress();
  }, 1200);
}
let CODEUP = null;
const PAGE_VER = '@@VER@@';   // remplacé par la version du code à l'envoi sur GitHub
// la page affichée est-elle plus vieille que le code installé ? → bannière « recharge »
function verCheck(c) {
  if (c && c.ver && PAGE_VER.indexOf('@@') < 0 && c.ver !== PAGE_VER && !(CODEUP && CODEUP.updated)) { CODEUP = { updated: true, bundle: c.ver, url: c.url }; if (D) render(); }
}
function load(force) {
  $('#stamp').textContent = force ? 'Mise à jour en cours…' : 'Chargement…';
  if (force) progress(true);
  const ok = txt => {
    if (!txt) { if (force) progress(false); $('#view').innerHTML = '<div class="empty">Aucune donnée encore. Lance « Update » dans ton Google Sheets, puis recharge.</div>'; $('#stamp').textContent = ''; return; }
    D = JSON.parse(txt); OWN = null; applyOvr(); render(); if (force) progress(false);
  };
  const ko = e => { if (force) progress(false); $('#stamp').textContent = 'Erreur : ' + (e && e.message || e); };
  if (window.google && google.script && google.script.run) {
    if (!force) {
      google.script.run.withSuccessHandler(ok).withFailureHandler(ko).getAppData();
      try { google.script.run.withSuccessHandler(t => { try { verCheck(JSON.parse(t)); } catch (e) {} }).codeVersion(); } catch (e) {}
      return;
    }
    // ↻ : d'abord le code (nouvelle version sur GitHub ?), puis les données — avec le nouveau code s'il vient d'être installé
    $('#plabel').textContent = 'Vérification du code…';
    google.script.run.withSuccessHandler(t => {
      let c = {}; try { c = JSON.parse(t || '{}'); } catch (e) {}
      CODEUP = c.updated ? c : (c.err ? { err: c.err } : null);
      if (!c.updated) verCheck(c);
      google.script.run.withSuccessHandler(ok).withFailureHandler(ko).refreshFromApp();
    }).withFailureHandler(() => google.script.run.withSuccessHandler(ok).withFailureHandler(ko).refreshFromApp()).checkCodeFromApp();
  } else if (window.MOCK) ok(JSON.stringify(window.MOCK));
}
$('#refresh').onclick = () => load(true);
// en revenant sur l'app (téléphone) : nouvelle version installée depuis l'ouverture de la page ?
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !(window.google && google.script && google.script.run)) return;
  try { google.script.run.withSuccessHandler(t => { try { verCheck(JSON.parse(t)); } catch (e) {} }).codeVersion(); } catch (e) {}
});
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return;
  setTab(b.dataset.t || LASTSUB[b.dataset.g] || GROUPS[b.dataset.g][0]); };

const me = () => D.teams.find(t => t.team === D.me) || D.teams[0];
// « Que faire ? » du point de vue d'une autre équipe : on se met dans ses souliers le temps du calcul
let POV = '', POV_REAL = null;

function power(players) {

  const F = ok.filter(p => p.grp === 'F').sort(by), Dd = ok.filter(p => p.grp === 'D').sort(by);
  const util = F.slice(L.F).concat(Dd.slice(L.D)).sort(by).slice(0, L.UTIL);
  const sk = F.slice(0, L.F).concat(Dd.slice(0, L.D), util).reduce((s, p) => s + v(p), 0) * gpw * D.config.injury;
  const g = ok.filter(p => p.grp === 'G').map(p => v(p) * (p.share || D.config.share) * gpw).sort((a, b) => b - a).slice(0, L.G).reduce((s, x) => s + x, 0);

}
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

    const w = T.map(t => t.record ? t.record.w + t.record.tie / 2 : 0), pf = T.map(t => t.record ? t.record.pf : 0);

      const a = idx[g.a], b = idx[g.b]; if (a == null || b == null) return;
      const sa = g.liveA + powers[a] * g.frac + gauss() * D.config.sd * Math.sqrt(g.frac);
      const sb = g.liveB + powers[b] * g.frac + gauss() * D.config.sd * Math.sqrt(g.frac);
      if (sa > sb) w[a]++; else w[b]++; pf[a] += sa; pf[b] += sb;

}

const MOBQ = window.matchMedia('(max-width:600px)');

function mobileFit(root) {

    if (tbl.dataset.fit || tbl.closest('.fo,#ps')) return;

// Gardiens : on juge sur la saison (FP par départ × part des départs), pas sur 2 semaines de calendrier

function cellVal(td, col) {

  if (!col) return t.replace(/^\d+\.\s*/, '').toLowerCase();               // 1re colonne : noms (A→Z)
  if (t === '–' || t === '') return null;
  let m = t.match(/^(\d+)\s*-\s*(\d+)(?:\s*-\s*(\d+))?$/);            // fiche 3-1 (ou 3-1-0)
  if (m) return +m[1] - +m[2] + (+m[1] + +m[2]) * 1e-4;

function sortTable(tbl, col, dir) {

  rows.sort((a, b) => {
    const x = cellVal(a.children[col], col), y = cellVal(b.children[col], col);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'fr');
    return dir === 'asc' ? c : -c;

  rows.forEach(r => parent.appendChild(r));

  const T = res.teams.slice().sort((a, b) => b.dLong - a.dLong); if (T.length < 2) return '';
  const W = T[0], Lz = T[T.length - 1], S = res.teams.slice().sort((a, b) => b.dShort - a.dShort)[0];
  const gap = W.dLong - Lz.dLong;
  let v = gap < 1 ? 'Échange équilibré selon le modèle.' : `<b>${esc(W.team)}</b> gagne à long terme (${sgn(W.dLong)} FP/sem. contre ${sgn(Lz.dLong)}).`;
  if (S.team !== W.team && S.dShort > 1) v += ` Mais <b>${esc(S.team)}</b> gagne ses 2 prochaines semaines (${sgn(S.dShort)} FP).`;
  const fooled = T.find(r => r.perc != null && r.perc >= 1.05 && r.dLong < -0.5);
  if (fooled) v += ` À ses yeux, ${esc(fooled.team)} a reçu plus qu’il a donné (${Math.round(fooled.perc * 100)} %), mais le modèle dit qu’il s’affaiblit : classique achat d’un joueur au sommet de sa chance.`;
  return v;
}
// ---------- Bilan de tes moves : ce que chaque décision a vraiment rapporté ----------
// Fenêtre : du jour où le move compte (après 18 h → le lendemain) jusqu'à hier. Le joueur ajouté compte jusqu'à ce que tu le retires.
// « Prévu » = projection maison (FP/match) au moment du move × matchs vraiment joués : l'écart réel − prévu, c'est la chance.
let MV_ON = false;
function mvEff(d) { const day = d.slice(0, 10), h = +d.slice(11, 13) || 0; return h >= 18 ? ymdAdd(day, 1) : day; }
function mvList() {
  const L = (D.moves || []).filter(m => m.i.length || m.o.length);
  // ESPN montre parfois un échange aussi comme retraits + ajouts : on écarte ces doublons (mêmes joueurs, à 12 h d'un échange)
  const trades = L.filter(m => m.tr), near = (a, b) => Math.abs(new Date(a.replace(' ', 'T')) - new Date(b.replace(' ', 'T'))) < 12 * 3600e3;
  return L.filter(m => m.tr || !trades.some(t => near(t.d, m.d) && m.i.concat(m.o).some(x => t.i.concat(t.o).some(y => y.n === x.n))));
}
function mvSide(list, from, untilOf, end) {
  let real = 0, exp = 0, n = 0, ok = true;
  const rows = list.map(x => {
    const p = findP(x.n) || (x.id ? { id: x.id, grp: x.g } : null);
    if (!p || !p.id) return { x: x, r: { n: 0, fp: 0 }, m: 0 };          // pas encore de match dans la LNH cette saison
    const to = untilOf ? untilOf(x.n) : end, R = to < from ? { n: 0, fp: 0 } : realWeek(p, { s: from, e: to });
    if (typeof R !== 'object') { ok = false; return { x: x, r: null, wait: R }; }
    const m = x.m != null ? x.m : (p.model || 0);
    real += R.fp; exp += m * R.n; n += R.n;
    return { x: x, r: R, m: m, to: to };
  });

}
function movesCard() {
  const L = mvList();
  if (!D.moves) return '';
  if (!L.length) return `<div class="card"><h2>Bilan de tes moves</h2><div class="empty">Aucun move de ton équipe enregistré pour l’instant.</div></div>`;
  const head = `<div class="card"><h2>Bilan de tes moves</h2>`;
  if (!MV_ON) return head + `<div class="small muted">Pour chaque ajout, retrait ou échange : les FP que tes nouveaux joueurs ont vraiment faits depuis, contre ceux que tu aurais eus en gardant les autres.</div>
    <button class="btn" id="mvgo" style="margin-top:8px">Calculer le bilan (${L.length} moves)</button></div>`;
  const end = ymdAdd(todayStr(), -1);
  // jusqu'à quand chaque joueur ajouté est resté : prochain move où il part
  const asc = L.slice().reverse();
  let tR = 0, tE = 0, wait = false;
  const rows = L.map(m => {
    const from = mvEff(m.d);
    const untilOf = n => { const nx = asc.find(z => z !== m && z.d >= m.d && z.o.some(y => y.n === n)); return nx ? ymdAdd(mvEff(nx.d), -1) : end; };
    // chaque arrivé compte tant qu'il reste ; les partis comptent jusqu'au départ du dernier arrivé (ou hier)
    const to = m.i.length ? m.i.map(x => untilOf(x.n)).reduce((a, b) => (a > b ? a : b)) : end;
    const I = mvSide(m.i, from, untilOf, end), O = mvSide(m.o, from, () => to, end);
    if (!I.ok || !O.ok) { wait = wait || I.rows.concat(O.rows).some(r => r.wait === 'loading'); }
    const dR = I.real - O.real, dE = I.exp - O.exp;
    if (I.ok && O.ok) { tR += dR; tE += dE; }
    const nm = (S, sg) => S.rows.map(r => `<div><span class="${sg === '+' ? 'up' : 'down'}">${sg}</span> ${esc(dn(r.x.n))}${r.r ? ` <span class="muted small">${f1(r.r.fp)} FP · ${r.r.n} m.</span>` : ''}</div>`).join('');
    const span = to < from ? 'annulé le jour même' : from === to ? dShort(from) : dShort(from) + ' → ' + dShort(to);
    const ver = !(I.ok && O.ok) ? '<span class="muted">…</span>' : `<b class="${dR >= 0 ? 'up' : 'down'}">${sgn(dR)}</b>`;
    const exp = !(I.ok && O.ok) ? '' : `<span class="${dE >= 0 ? 'up' : 'down'}">${sgn(dE)}</span>`;
    return `<tr><td class="l">${m.tr ? '🔁 ' : ''}<span class="small muted">${esc(span)}</span>${nm(I, '+')}${nm(O, '−')}</td><td>${ver}</td><td title="Projection maison × matchs joués">${exp}</td></tr>`;
  }).join('');
  if (wait) setTimeout(() => { if (TAB === 'tx') render(); }, 700);
  const luck = tR - tE;
  const sum = `Au total, tes moves t’ont rapporté <b class="${tR >= 0 ? 'up' : 'down'}">${sgn(tR)} FP</b> par rapport à garder tes joueurs. La maison en prévoyait <b>${sgn(tE)}</b> sur les mêmes matchs : ${Math.abs(luck) < 5 ? 'résultat conforme aux attentes.' : luck > 0 ? `tu as eu <b>${f1(luck)} FP de chance</b> en plus.` : `la malchance t’a coûté <b>${f1(-luck)} FP</b> — les décisions étaient meilleures que le résultat.`}`;
  const late = L.some(m => m.late);
  return head + `<div class="verdict">${sum}</div><div class="tbl" style="margin-top:8px"><table><tr><th class="l">Move (période jugée)</th><th title="FP réels des arrivés − FP réels des partis, mêmes jours">Réel</th><th title="Ce que la projection maison prévoyait sur les mêmes matchs">Prévu</th></tr>${rows}</table></div>
    <div class="small muted" style="margin-top:6px">Chaque joueur arrivé compte du jour où le move compte jusqu’à ce que tu le retires ; les joueurs partis comptent jusqu’au départ du dernier arrivé (ou hier). Un joueur qui sert de monnaie d’échange le lendemain compte donc dans les deux moves. Les deux côtés comptent tous leurs matchs, même ceux où le joueur aurait été sur le banc.${late ? ' Pour les moves faits avant le suivi, « prévu » utilise la projection actuelle.' : ''}</div></div>`;
}
function vTx() {
  return movesCard() + vTxList();
}
function vTxList() {
  const tx = D.tx || [];
  if (!tx.length) return `<div class="card"><h2>Transactions de la ligue</h2><div class="empty">${D.tx ? 'Aucune transaction dans les 14 derniers jours.' : 'Mets les données à jour pour lire les transactions ESPN.'}</div>${txSeenNote()}</div>`;
  const pl = (l, team) => l.map(p => `${pname(p, team)} <span class="muted small">${f2(p.model)}</span> ${pChip(p)}`).join(', ') || '—';
  const trades = tx.filter(t => t.trade).map(t => {
    const r = evalTrade(t);
    const rows = r.teams.map(x => `<tr><td>${esc(x.team)}${x.team === D.me ? ' <span class="chip good">toi</span>' : ''}</td><td class="l">${pl(x.got, x.team)}</td><td class="l">${pl(x.gave, '')}</td>
      <td class="${x.dShort >= 0 ? 'up' : 'down'}">${sgn(x.dShort)}</td><td class="${x.dLong >= 0 ? 'up' : 'down'}"><b>${sgn(x.dLong)}</b></td><td>${pct(x.po0)} → <b>${pct(x.po1)}</b></td>
      <td>${x.perc != null ? Math.round(x.perc * 100) + ' %' : '–'}</td></tr>`).join('');
    return `<div class="card"><h2>🔁 Échange · ${esc(t.date)}</h2><div class="tbl"><table><tr><th>Équipe</th><th class="l">Reçoit</th><th class="l">Donne</th><th title="FP sur les 2 prochaines semaines">Court terme</th><th title="FP par semaine, reste de la saison">Long terme</th><th>Séries</th><th title="Ce qu'il reçoit / ce qu'il donne, selon la réputation (analystes) et les stats réelles">À ses yeux</th></tr>${rows}</table></div>
      <div class="verdict" style="margin-top:8px">${tradeVerdict(r)}</div>
      <div class="small muted" style="margin-top:4px">Tes chances de séries : ${pct(r.me0)} → <b>${pct(r.me1)}</b>${Math.abs(r.me1 - r.me0) >= 0.02 ? (r.me1 < r.me0 ? ' — cet échange renforce un rival' : ' — cet échange t’aide') : ''}.</div></div>`;
  }).join('');
  const moves = tx.filter(t => !t.trade).map(t => {
    const add = t.items.filter(i => i.kind === 'ADD').map(i => findP(i.name) ? `${pname(findP(i.name), i.to)} <span class="muted small">${f2(findP(i.name).model)}</span> ${pChip(findP(i.name))}` : esc(i.name)).join(', ');
    const drop = t.items.filter(i => i.kind === 'DROP').map(i => findP(i.name) ? `${pname(findP(i.name), '')} <span class="muted small">${f2(findP(i.name).model)}</span>` : esc(i.name)).join(', ');
    return `<tr><td>${esc(t.date)}</td><td>${esc(t.team)}${t.team === D.me ? ' <span class="chip good">toi</span>' : ''}</td><td class="l">${add || '—'}</td><td class="l">${drop || '—'}</td></tr>`;
  }).join('');
  return trades + (moves ? `<div class="card"><h2>Ajouts et retraits</h2><div class="tbl"><table><tr><th>Quand</th><th>Équipe</th><th class="l">Ajoute</th><th class="l">Retire</th></tr>${moves}</table></div></div>` : '') +
    `<div class="legend"><span>Échanges évalués avec les alignements actuels : avant = on remet les joueurs à leur ancienne équipe. Court terme = FP sur 2 semaines (calendrier, blessés) ; long terme = FP/semaine du meilleur alignement ; séries = 800 saisons simulées.</span></div>` + txSeenNote();
}
function txSeenNote() {
  const t = D.txSeen; if (!t || !Object.keys(t).length) return '';
  return `<div class="small muted" style="margin-top:6px">Lu chez ESPN : ${Object.keys(t).sort().map(k => `${esc(k)} ×${t[k]}`).join(' · ')}</div>`;
}
function bindTx() { const b = $('#mvgo'); if (b) b.onclick = () => { MV_ON = true; render(); }; }

// ---------- Probabilité de gagner le duel de la semaine (en direct) ----------
const SCOW = { s: [3, 2, 0.5, 0.5, 0.2, 0.2, 0.4], g: [3, -1, 0.2, 3, 1] };
function volParams() { const v = D.config && D.config.bt && D.config.bt.vol; return v ? { phi: v.phi, sm: v.sm, cal: true } : { phi: 1.2, sm: 0.3, cal: false }; }
function varGame(p) {   // variance des FP d'un match (loi de Poisson élargie par phi), à partir de ses taux par match projetés
  const r = p.x && p.x.r, V = volParams(); if (!r) return V.phi * 4 * Math.max(0.5, p.model || 1);
  const w = p.grp === 'G' ? SCOW.g : SCOW.s;
  return V.phi * r.reduce((t, x, i) => t + w[i] * w[i] * Math.max(0, x || 0), 0);
}
function weekOutlook(team) {
  const days = horizonDays(D.weekEnd), V = volParams(), games = new Map();
  let mean = 0, varr = 0;
  days.forEach(d => {
    const L = dayLineup(team.players, d);
    L.starters.forEach(p => { const a = avail(p, d) * gameFrac(p, d); mean += (p.model || 0) * a * oppMult(p, d); varr += varGame(p) * a; games.set(p, (games.get(p) || 0) + a); });
    L.goalies.forEach(p => { const sh = gShare(p, d) * avail(p, d) * gameFrac(p, d), m = goalieFP(p, d); mean += m * sh; varr += sh * (varGame(p) + m * m) - (sh * m) ** 2; games.set(p, (games.get(p) || 0) + sh); });
  });
  games.forEach(n => { varr += (V.sm * n) ** 2; });
  return { mean: mean, sd: Math.sqrt(varr) };
}
const normCdf = z => { const t = 1 / (1 + 0.2316419 * Math.abs(z)), d = 0.3989423 * Math.exp(-z * z / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; };
function duelOdds(m) {
  m = m || me(); const r = m.record || {}, o = D.teams.find(t => t.team === r.opp);
  if (!o || r.live == null) return null;
  const a = weekOutlook(m), b = weekOutlook(o), mu = (r.live + a.mean) - (r.oppLive + b.mean), sd = Math.sqrt(a.sd ** 2 + b.sd ** 2);
  return { p: sd > 0 ? normCdf(mu / sd) : (mu > 0 ? 1 : 0), me: r.live + a.mean, opp: r.oppLive + b.mean, lo: r.live + a.mean - 1.28 * a.sd, hi: r.live + a.mean + 1.28 * a.sd,
           olo: r.oppLive + b.mean - 1.28 * b.sd, ohi: r.oppLive + b.mean + 1.28 * b.sd, oppName: o.team };
}
function duelKpi() {
  const d = duelOdds(); if (!d) return '';
  return `<div class="kpi" title="Ton pointage actuel + tes matchs restants cette semaine (alignement jour par jour), contre ton adversaire. ${volParams().cal ? 'Fourchettes calibrées par le backtest.' : 'Fourchettes non calibrées (lance le backtest).'}"><div class="v ${d.p >= 0.5 ? 'up' : 'down'}">${pct(d.p)}</div>
    <div class="l">Chances de gagner ta semaine vs ${esc(d.oppName)} · projeté ${f1(d.me)} – ${f1(d.opp)} (toi : ${f1(d.lo)} à ${f1(d.hi)} à 80 %)</div></div>`;
}
